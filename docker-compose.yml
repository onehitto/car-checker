# Local development stack.
#   docker compose up --build         # everything: web app on http://localhost:5173,
#                                     # API on http://localhost:8000/docs
#   docker compose up -d db redis     # infrastructure only (run the API from your IDE)
#   docker compose --profile production up -d web   # production web build on :8080
#   docker compose --profile test run --rm e2e      # Playwright end-to-end tests

name: car-checker

x-backend: &backend
  build: ./backend
  image: car-checker-backend:dev
  restart: unless-stopped
  env_file:
    - path: ./backend/.env
      required: false
  environment: &backend-env
    APP_ENV: ${APP_ENV:-development}
    DATABASE_URL: postgresql+asyncpg://car_checker:car_checker@db:5432/car_checker
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIRECTORY: /data/uploads
    LOG_FORMAT: ${LOG_FORMAT:-console}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  volumes:
    - uploads:/data/uploads

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: car_checker
      POSTGRES_PASSWORD: car_checker
      POSTGRES_DB: car_checker
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_checker -d car_checker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    command: ["api"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    image: car-checker-frontend:dev
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - api

  web:
    profiles: ["production"]
    build:
      context: ./frontend
      target: runtime
    image: car-checker-web:latest
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api

  e2e:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    user: "1000:1000"
    ipc: host
    environment:
      E2E_BASE_URL: http://frontend:5173
      HOME: /tmp
    volumes:
      - ./frontend:/app
    command: ["npx", "playwright", "test"]
    depends_on:
      - frontend

volumes:
  pgdata:
  uploads:
