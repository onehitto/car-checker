# Local development stack.
#   docker compose up --build         # everything: API on http://localhost:8000/docs
#   docker compose up -d db redis     # infrastructure only (run the API from your IDE)

name: car-checker

x-backend: &backend
  build: ./backend
  image: car-checker-backend:dev
  restart: unless-stopped
  env_file:
    - path: ./backend/.env
      required: false
  environment: &backend-env
    APP_ENV: ${APP_ENV:-development}
    DATABASE_URL: postgresql+asyncpg://car_checker:car_checker@db:5432/car_checker
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIRECTORY: /data/uploads
    LOG_FORMAT: ${LOG_FORMAT:-console}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  volumes:
    - uploads:/data/uploads

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: car_checker
      POSTGRES_PASSWORD: car_checker
      POSTGRES_DB: car_checker
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_checker -d car_checker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    command: ["api"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
